<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Jobs</title>
<style>*{box-sizing:border-box}body{font-family:system-ui;margin:0;background:#f6f6f8}header{background:#fff;padding:16px 32px;border-bottom:1px solid #ddd}main{padding:32px;max-width:640px}label{display:block;margin:16px 0 6px;font-weight:600}input,select{width:100%;padding:10px;font:inherit}button{margin-top:20px;padding:10px 18px;font:inherit;background:#4f46e5;color:#fff;border:0;border-radius:8px}</style></head>
<body><header><a href="/">Dashboard</a> · <a href="/index.html#new">Post a job</a></header>
<main><h1>Post a job</h1><form onsubmit="event.preventDefault();document.getElementById('done').hidden=false">
<label for="t">Job title</label><input id="t" placeholder="e.g. Laravel developer">
<label for="k">Contract</label><select id="k"><option>Full time</option><option>Part time</option><option>Contract</option></select>
<label><input type="checkbox" id="r"> Remote friendly</label>
<button type="submit">Publish job</button></form>
<p id="done" hidden role="status">Your job is live.</p>
<div style="height:1200px"></div><p>Footer notes</p></main><script>console.warn('Draft autosave is off');</script><img src="/missing-logo.png" alt="" width="1" height="1"></body></html>
