name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}${{ matrix.stability == 'prefer-lowest' && ', lowest' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12.*', '13.*']
        stability: [prefer-stable]
        include:
          - laravel: '12.*'
            testbench: '10.*'
          - laravel: '13.*'
            testbench: '11.*'
          # The oldest versions composer.json allows
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            stability: prefer-lowest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3, fileinfo
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  recording:
    # Records real videos with Playwright and ffmpeg (the tests the other job skips)
    name: Recording, with Playwright and ffmpeg
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, fileinfo
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install Playwright and Chromium
        # The same Playwright version video-demo:install uses
        run: |
          mkdir -p "$RUNNER_TEMP/recorder"
          cd "$RUNNER_TEMP/recorder"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.64.0
          npx playwright install --with-deps chromium

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run recording tests
        env:
          VIDEO_DEMO_TEST_NODE_MODULES: ${{ runner.temp }}/recorder/node_modules
          VIDEO_DEMO_TEST_FFMPEG: ffmpeg
        run: vendor/bin/phpunit --filter RecorderTest

